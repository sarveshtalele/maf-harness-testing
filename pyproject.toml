[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maf-test-harness"
version = "1.0.0"
description = "Human-in-the-loop repository test-planning harness built on Microsoft Agent Framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-openai==1.14.3",
  "agent-framework-core==1.20.0",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3.0",
  "filelock>=3.16,<5.0",
]

[project.scripts]
maf-harness = "maf_test_harness.cli:main"
maf-backend = "maf_test_harness.desktop_backend:main"

[project.optional-dependencies]
e2e = ["playwright>=1.58,<2", "pytest-playwright>=0.7,<1"]
hooks = ["agent-hooks-sdk>=0.1.0a5,<0.2"]  # optional AGENT-HOOKS-0.1 backend for the hook engine (docs/HOOKS.md)
mcp = ["mcp>=1.24,<2"]  # MCP server integration (docs/MCP.md); included by desktop and dev
desktop = ["pyinstaller>=6.10,<7", "mcp>=1.24,<2"]  # builds the bundled desktop backend (packaging/backend.spec)
dev = [
  "mcp>=1.24,<2",
  "pytest>=8.3,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maf_test_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".references", "skills"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF100"]
ignore = ["E501", "B008", "SIM108", "SIM105", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.ruff.format]
quote-style = "double"
