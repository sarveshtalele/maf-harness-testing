display_name: JUnit Generator
category: Test Automation & Data
description: >-
  Generates reviewable JUnit 5 Jupiter Java test skeletons, parameterized test methods, fixture
  mappings, and a traceability manifest from structured test cases and designs.
status: verified
license: Proprietary (contact maintainers)
author: Tata Consultancy Services
