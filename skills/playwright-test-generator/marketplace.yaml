tasks:
  - name: Plan the user journey
    description: >-
      Identifies the target page and confirms the intended user flow before producing a Playwright
      script.
    input_schema: Test intent, user journey description, or acceptance criteria.
    output_schema: Planned test flow and context for implementation.
    async: true
  - name: Generate Playwright test script
    description: >-
      Transforms the user story into resilient Playwright code by following selector hierarchy,
      web-first assertions, and anti-flaky test patterns.
    input_schema: Plain English test steps and page context.
    output_schema: Generated `.spec.ts` Playwright script saved in the expected output location.
    async: true
  - name: Validate implementation quality
    description: >-
      Checks that the generated code uses stable locators, avoids timeout-based waiting, and handles
      ambiguity and strict mode conditions appropriately.
    input_schema: Generated Playwright script and validation checklist.
    output_schema: Validation notes confirming selector robustness and script completeness.
    async: true
documentation:
