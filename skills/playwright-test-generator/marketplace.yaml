display_name: Playwright Test Generator
category: Test Automation & Data
description: >-
  Converts plain-English user journeys, acceptance criteria, and manual test steps into resilient
  Playwright automation scripts with robust selectors, web-first assertions, and validation-focused
  structure.
status: verified
