appId: com.internal.agenticqe
productName: Agentic QE
# Release assets: no spaces, OS and arch always visible (e.g. Agentic-QE-<version>-mac-arm64.dmg).
artifactName: "Agentic-QE-${version}-${os}-${arch}.${ext}"
directories:
  output: release
files:
  - dist/**
  - "!dist/**/*.test.js"
  - package.json
extraResources:
  # PyInstaller one-folder output (packaging/backend.spec, contents_directory='.'); launched as resources/backend/maf-backend[.exe]
  - from: ../build/backend
    to: backend
  # Next standalone (build with DESKTOP_BUILD=1); server.js ends up at resources/frontend/server.js.
  # outputFileTracingRoot=frontend (next.config.ts) keeps server.js at the top; scripts/build_desktop.py copies
  # .next/static and public into the standalone dir first.
  - from: ../build/frontend
    to: frontend
    # Staged by scripts/build_desktop.py (stage_frontend): node_modules renamed to deps, because electron-builder
    # always drops node_modules from extraResources; main.ts sets NODE_PATH to resources/frontend/deps.
    filter:
      - "**/*"
      - ".next/**/*"
      - "deps/**/*"
win:
  # Required by the MSI target: its shortcuts reference the product icon (WiX LGHT0094 without it).
  icon: assets/icon.ico
  target:
    - target: msi
      arch: [x64]
# Per-machine MSI (WiX): installs to Program Files for all users and needs administrator approval. oneClick false gives the
# assisted wizard (silent: msiexec /i <msi> /qn). upgradeCode is FIXED for the life of the product so each new version
# upgrades the installed one in place. Never change it: a new code makes a second, parallel installation.
msi:
  perMachine: true
  oneClick: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  upgradeCode: "277538a5-b263-410a-b2b4-23a1670e4974"
mac:
  target:
    - target: dmg   # arch comes from the CLI (--x64/--arm64): the bundled backend is built for the runner's arch only
  identity: null   # unsigned / not notarized (internal distribution); see docs/DESKTOP.md
  category: public.app-category.developer-tools
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
# Electron fuses (applied at pack time). runAsNode stays ON on purpose: the UI server is spawned as
# process.execPath with ELECTRON_RUN_AS_NODE=1 (main.ts specs), so turning it off would stop the UI. NODE_OPTIONS and
# the inspector flags are off; the app code loads only from app.asar.
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# No auto-update publisher on purpose: "Check for updates" opens the GitHub Releases page.
publish: null
