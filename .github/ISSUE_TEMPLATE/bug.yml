name: Bug report
description: Something in the harness or UI behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `uv run maf-harness run <repo-url>`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. 1.0.0 or a short SHA"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or run ID
      description: Paste relevant log lines or the run ID. Remove any credentials or tokens first.
      render: text
