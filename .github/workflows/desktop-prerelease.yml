name: desktop-prerelease
on:
  workflow_dispatch:
  push:
    tags: ["v*-rc*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  ui:
    uses: ./.github/workflows/ui.yml

  build:
    needs: [ci, ui]
    environment: dev
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest}
          - {os: macos-14, arch: arm64}
          - {os: macos-15-intel, arch: x64}
          - {os: ubuntu-latest}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
      - name: Install Python deps
        run: uv sync --locked --python 3.12 --extra dev --extra desktop
      - name: Check versions
        run: uv run python scripts/check_version.py
      - name: Build desktop installers
        run: uv run python scripts/build_desktop.py ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }}
      - name: Backend self-check
        run: build/backend/maf-backend --self-check
      - name: Install smoke test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
      - name: Packaged app smoke test
        # Launches the installer's app (AGENTIC_QE_SMOKE=1); Linux needs a virtual display.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}uv run python scripts/desktop_smoke.py --output smoke-output.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          # not "desktop-*": the release job downloads that pattern into the release assets
          name: smoke-desktop-${{ matrix.os }}
          path: smoke-output.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.os }}
          # installers only: unpacked app folders and builder-debug.yml would collide across runners
          path: |
            desktop/release/*.msi
            desktop/release/*.dmg
            desktop/release/*.AppImage
          if-no-files-found: error
