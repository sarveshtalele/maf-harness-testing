name: nightly
# Scheduled full run on all three desktop OSes: the whole pytest suite and the desktop shell tests, so drift from
# upstream packages or runners shows up within a day. Lint, architecture and UI checks stay in ci.yml and ui.yml.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    environment: dev
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
      - name: Install
        run: uv sync --locked --extra dev --python 3.12
      - name: Full test suite
        run: uv run pytest -q --ignore=tests/targets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop shell tests
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --include=dev && npm test
        working-directory: desktop
