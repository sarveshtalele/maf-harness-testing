name: ci
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
  workflow_call:  # desktop-release and desktop-prerelease run this on the tag commit before they build

# Literal prefix: inside workflow_call, github.workflow and github.event_name belong to the caller, so a shared
# expression would make ci and ui cancel each other during a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
      - name: Install
        run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Architecture doc up to date
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: uv run python scripts/gen_architecture.py --check
      - name: Version files agree
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: uv run python scripts/check_version.py
      - name: Agent Skills spec lint
        run: uv run maf-harness lint-skills --strict
      - name: Generation benchmark reference calibration (offline)
        run: uv run python scripts/benchmark_generation.py --output benchmark-results/calibration
      - name: Upload generation benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generation-benchmark-${{ matrix.os }}-py${{ matrix.python }}
          path: benchmark-results/calibration
      - name: Unit, component (real MAF, scripted transport) and workflow e2e tests
        run: uv run pytest -q --ignore=tests/targets

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail on credential-shaped strings
        # scripts/secrets_scan.py holds the pattern (provider keys, AWS key ids, Slack tokens, PEM headers) and
        # tests/test_secrets_scan.py checks it against samples. Stdlib only, so no setup step is needed.
        run: python3 scripts/secrets_scan.py
