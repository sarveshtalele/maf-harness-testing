name: ci
on:
  push:
    branches: [main, new-ui]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Agent Skills spec lint
        run: uv run maf-harness lint-skills
      - name: Unit, component (real MAF, scripted transport) and workflow e2e tests
        run: uv run pytest -q --ignore=tests/targets

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on credential-shaped strings
        run: |
          if grep -rIE "sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}" --exclude-dir=.git --exclude=uv.lock . ; then
            echo "credential-shaped string found"; exit 1
          fi
