name: Local UI compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  local-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --extra dev --extra e2e
      - run: uv run pytest tests/test_ui_api.py tests/test_platform_compat.py -q
      - run: uv run ruff check src tests scripts
      - run: uv run pytest tests/test_clone_transport.py tests/test_git_lifecycle.py -q
      - name: Real GitHub clones (Windows Schannel, POSIX default TLS)
        run: >-
          uv run python -c "import os, tempfile; from pathlib import Path; from maf_test_harness.repo.analyzer import clone_repository; os.environ.update({'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.sslBackend','GIT_CONFIG_VALUE_0':'schannel'} if os.name == 'nt' else {}); root = Path(tempfile.mkdtemp(prefix='qe-github-clone-')); print(clone_repository('https://github.com/sarveshtalele/requirement-analysis-skill', root / 'requirements')); print(clone_repository('https://github.com/agoncal/agoncal-application-petstore-ee7', root / 'petstore'))"
      - name: Install without npm command shims (Windows regression)
        run: npm ci --include=dev --bin-links=false
        working-directory: frontend
      - run: uv run pytest tests/test_ui_launcher.py -q
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run pytest tests/test_ui_launcher.py -q
      - name: macOS launcher smoke check
        if: runner.os == 'macOS'
        run: ./start-macos.command --smoke-test
      - name: Windows launcher smoke check
        if: runner.os == 'Windows'
        run: .\start-windows.cmd --smoke-test
      - name: Linux launcher smoke check
        if: runner.os == 'Linux'
        run: bash start-linux.sh --smoke-test
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-report-${{ matrix.os }}
          path: |
            frontend/test-results
            frontend/playwright-report
