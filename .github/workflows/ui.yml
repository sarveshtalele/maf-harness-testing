name: Local UI compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  local-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --extra dev --extra e2e
      - run: uv run pytest tests/test_ui_api.py tests/test_platform_compat.py -q
      - run: uv run ruff check src tests scripts
      - run: npm ci
        working-directory: frontend
      - run: uv run pytest tests/test_ui_launcher.py -q
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: macOS launcher smoke check
        if: runner.os == 'macOS'
        run: ./start-macos.command --help
      - name: Windows launcher smoke check
        if: runner.os == 'Windows'
        run: .\start-windows.cmd --help
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-report-${{ matrix.os }}
          path: |
            frontend/test-results
            frontend/playwright-report
