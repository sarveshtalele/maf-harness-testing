name: Local UI compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  local-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --extra dev --extra e2e
      - run: uv run pytest tests/test_ui_api.py tests/test_platform_compat.py -q
      - run: uv run ruff check src tests app.py scripts
      - run: npm ci
        working-directory: frontend
      - run: uv run pytest tests/test_ui_launcher.py -q
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-${{ matrix.os }}
          path: frontend/test-results
