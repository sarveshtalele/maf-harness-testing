name: desktop-release
on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-rc*"

permissions:
  contents: read

jobs:
  build:
    environment: prod
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest}
          - {os: macos-14, arch: arm64}
          - {os: macos-15-intel, arch: x64}
          - {os: ubuntu-latest}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Guard (desktop/ present?)
        id: guard
        run: |
          if [ -f desktop/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::desktop/ not present yet - skipping"
          fi
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.present == 'true'
        with:
          node-version-file: frontend/.nvmrc
      - uses: astral-sh/setup-uv@v7
        if: steps.guard.outputs.present == 'true'
      - name: Install Python deps
        if: steps.guard.outputs.present == 'true'
        run: uv sync --python 3.12 --extra dev --extra desktop
      - name: Check versions
        if: steps.guard.outputs.present == 'true'
        run: uv run python scripts/check_version.py
      - name: Build desktop installers
        if: steps.guard.outputs.present == 'true'
        run: uv run python scripts/build_desktop.py ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }}
      - name: Backend self-check
        if: steps.guard.outputs.present == 'true'
        run: build/backend/maf-backend --self-check
      - name: Install smoke test dependencies (Linux)
        if: steps.guard.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
      - name: Packaged app smoke test
        if: steps.guard.outputs.present == 'true'
        # Launches the installer's app (AGENTIC_QE_SMOKE=1); Linux needs a virtual display.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}uv run python scripts/desktop_smoke.py --output smoke-output.txt
      - uses: actions/upload-artifact@v7
        if: failure() && steps.guard.outputs.present == 'true'
        with:
          # not "desktop-*": the release job downloads that pattern into the release assets
          name: smoke-desktop-${{ matrix.os }}
          path: smoke-output.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.present == 'true'
        with:
          name: desktop-${{ matrix.os }}
          # installers only: unpacked app folders and builder-debug.yml would collide across runners
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Guard (desktop/ present?)
        id: guard
        run: |
          if [ -f desktop/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::desktop/ not present yet - skipping"
          fi
      - uses: actions/download-artifact@v8
        if: steps.guard.outputs.present == 'true'
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        if: steps.guard.outputs.present == 'true'
        with:
          draft: true
          files: dist/*
